name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: jishnuteegala/.github/.github/workflows/app-ci.yml@v1
    with:
      pre-check: |
        curl --fail --location --output jq \
          https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
        echo "5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5  jq" | sha256sum --check
        chmod +x jq
        ./jq --version | grep -Fx jq-1.7.1
        mv jq jq-1.7.1
      post-check: |
        pnpm run build
        pnpm run check:privacy
        test -f dist/index.html
        test -f dist/design-system/index.html
        test -f dist/llms.txt
        test -f dist/_headers
        SOURCE_DATE_EPOCH=315532800 python -X utf8 scripts/package_release.py snapshot
        (cd artifact && sha256sum --check SHA256SUMS)
